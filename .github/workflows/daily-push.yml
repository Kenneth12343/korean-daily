name: TOPIK Korean Daily Push

on:
  schedule:
    # UTC 00:00 = Beijing 08:00 每天早上8点
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发测试

jobs:
  send-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送 progress.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send daily Korean email
        env:
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
        run: python send_email.py

      - name: Commit progress back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git diff --staged --quiet || git commit -m "Update progress [skip ci]"
          git push
